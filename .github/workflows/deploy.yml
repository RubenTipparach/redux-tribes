name: Build, test, and deploy

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# NO workflow level concurrency. A workflow level group with cancel-in-progress
# cancels the WHOLE run, including the deploy, when a newer commit lands, which
# is what leaves a live app stale while everything else looks healthy.
# Concurrency is applied PER JOB instead.
jobs:
  # The simulation core is the one thing both clients share, so it is gated
  # first and on its own: if the model is wrong, nothing downstream matters.
  sim:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust with the wasm target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown
      - name: Test the core
        working-directory: engine/sim_core
        run: cargo test --release
      - name: Build for wasm
        working-directory: engine/sim_core
        run: cargo build --release --target wasm32-unknown-unknown

  # The JS prototype is still the design reference for mechanics the Rust core
  # has not absorbed yet, so its suite stays a gate.
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: node prototype/cli.js test
      - name: Generated assets match their generators (GUIDELINES rule 3)
        run: |
          python3 tools/make_ember_texture.py --check
          python3 tools/make_surface_textures.py --check
      - name: Mockups match their sources (GUIDELINES rule 2.1)
        run: python3 tools/build_mockups.py --check
      - name: No dashes anywhere (GUIDELINES rule 1)
        run: |
          if grep -rlP '[\x{2013}\x{2014}]' --exclude-dir=.git --exclude-dir=vendor \
               --exclude-dir=node_modules --exclude-dir=target --exclude-dir=archive-model .; then
            echo "::error::em or en dash found in the files listed above"
            exit 1
          fi

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - working-directory: server
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm run build
          npm test

  web:
    needs: sim
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      # The client builds its own copy of the core. `needs: sim` still gates it,
      # so a broken model stops the pipeline; this only avoids handing the wasm
      # between jobs, which would make the build depend on artifact storage
      # quota, an account wide resource this repository does not control.
      - name: Install Rust with the wasm target
        run: |
          rustup toolchain install stable --profile minimal
          rustup target add wasm32-unknown-unknown
      - working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run sim
          npm run typecheck
          npm test
          node build.mjs

  # One deploy target. The Fly machine serves the client as well as the API, so
  # the page and the API it talks to are always the same build, which two
  # separate pipelines cannot promise. It also means no Pages enablement and no
  # artifact storage in the critical path.
  deploy:
    needs: [sim, prototype, api, web]
    runs-on: ubuntu-latest
    # Only on the canonical repo, so forks without Fly access fall through
    # cleanly. Case insensitive so a clone under either casing works.
    if: ${{ contains(fromJSON('["rubentipparach/redux-tribes", "RubenTipparach/redux-tribes"]'), github.repository) }}
    # One deploy at a time, and a NEWER one supersedes an older one that has
    # not finished. With cancel-in-progress false these queued strictly, so a
    # run of pushes stacked three full deploys back to back, each one waiting
    # up to twenty minutes on Fly's builder, and the first two were shipping
    # code the third already replaced. An older image is worth nothing once a
    # newer one is waiting behind it.
    #
    # This is a PER JOB group, which is the distinction the note at the top of
    # this file is about: cancelling at workflow level would kill the tests
    # too, and a run whose tests were cancelled cannot say the build is good.
    concurrency:
      group: fly-deploy
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      # Pre-bootstrap is "skip, do not fail": a missing token, a rejected token,
      # or an app that does not exist yet all mark the job not ready and the
      # deploy steps skip. A genuine failure after bootstrap still fails the job.
      - name: Check Fly readiness
        id: fly_gate
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "${FLY_API_TOKEN}" ]; then
            echo "::notice::FLY_API_TOKEN not set; skipping deploy."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! flyctl auth whoami > /dev/null 2>&1; then
            echo "::notice::FLY_API_TOKEN rejected by Fly; regenerate with 'fly tokens create deploy -a redux-tribes'."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! flyctl status -a redux-tribes > /dev/null 2>&1; then
            echo "::notice::App not found; bootstrap with 'fly apps create redux-tribes' and 'fly volumes create ft_data --size 1 --region ord'."
            echo "ready=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # Single writer sqlite needs exactly one machine on one volume, and that
      # one machine has to live in REGION. Keep REGION in step with
      # primary_region in server/fly.toml: this step is what actually enforces
      # it, because primary_region only decides where NEW machines are placed
      # and a deploy updates an existing machine wherever it already is.
      #
      # Idempotent: a no-op once the app is already one machine in REGION.
      - name: Ensure volume and a single machine in REGION
        if: steps.fly_gate.outputs.ready == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          APP: redux-tribes
          REGION: ord
        run: |
          set -e
          COUNT=$(flyctl volumes list -a "$APP" --json | jq '[.[] | select(.name=="ft_data" and .region=="'"$REGION"'")] | length')
          if [ "${COUNT:-0}" -lt 1 ]; then
            flyctl volumes create ft_data --size 1 --region "$REGION" --app "$APP" --yes
          fi

          # Destroy every app machine outside REGION, and all but one inside it.
          # sort_by puts false before true, so off-region machines are listed
          # first and the survivor is always one already in REGION. They also
          # have to go first for their own sake: a machine still holding an
          # off-region volume blocks that volume from ever being released.
          flyctl machine list -a "$APP" --json > /tmp/machines.json
          jq -r --arg r "$REGION" '
            [ .[] | select((.config.metadata.fly_process_group // "app") == "app") ]
            | sort_by(.region == $r)
            | .[] | "\(.id) \(.region) \(if .region == $r then "keep" else "move" end)"
          ' /tmp/machines.json > /tmp/plan.txt
          KEPT=""
          while read -r M MR TAG; do
            if [ "$TAG" = "keep" ] && [ -z "$KEPT" ]; then
              KEPT="$M"; echo "keeping $M in $MR"; continue
            fi
            if [ "$TAG" = "move" ]; then
              echo "destroying machine $M in $MR: outside $REGION"
            else
              echo "destroying extra machine $M in $MR"
            fi
            flyctl machine stop "$M" --app "$APP" || true
            flyctl machine destroy "$M" --app "$APP" --force || true
          done < /tmp/plan.txt

          # Volumes are NOT reaped here: a volume is the sqlite database, and
          # this workflow does not get to delete a database on its own. Say
          # where the strays are and let a human decide.
          STRAY=$(flyctl volumes list -a "$APP" --json | jq -r '.[] | select(.name=="ft_data" and .region!="'"$REGION"'") | .id')
          if [ -n "$STRAY" ]; then
            for V in $STRAY; do
              echo "::warning::volume $V is outside $REGION and now unused; delete with 'fly volumes destroy $V -a $APP' once you are sure its data is expendable."
            done
          fi

      # Built from the repository ROOT: the image compiles the Rust core to
      # wasm, bundles the client against it, then serves both from the API
      # process. See server/Dockerfile.
      #
      # Fly's remote builder can drop a connection transiently and fail within
      # seconds, before any build output. Retry with backoff, the same doctrine
      # this repo already follows for git push and fetch.
      - name: Deploy to Fly.io
        if: steps.fly_gate.outputs.ready == 'true'
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -e
          for attempt in 1 2 3 4; do
            echo "::group::flyctl deploy (attempt ${attempt}/4)"
            if flyctl deploy --remote-only --config server/fly.toml --dockerfile server/Dockerfile .; then
              echo "::endgroup::"; echo "deployed on attempt ${attempt}"; exit 0
            fi
            echo "::endgroup::"
            if [ "${attempt}" -lt 4 ]; then
              backoff=$((attempt * attempt * 10))
              echo "::warning::deploy failed (attempt ${attempt}/4); retrying in ${backoff}s"
              sleep "${backoff}"
            fi
          done
          echo "::error::flyctl deploy failed after 4 attempts"; exit 1
